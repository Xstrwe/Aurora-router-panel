name: Build package and feed

on:
  push:
    branches: [main]
    paths:
      - 'files/**'
      - 'control/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'files/**'
      - 'control/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ipk and feed index
        run: ./build.sh
      - name: Upload ipk and feed
        uses: actions/upload-artifact@v4
        with:
          name: aurora-router-panel-feed
          path: feed/all/
      - name: Commit feed if it changed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Xstrwe"
          git config user.email "56885243+Xstrwe@users.noreply.github.com"
          git add feed/
          if git diff --staged --quiet; then
            echo "Feed is already up to date."
            exit 0
          fi
          git commit -m "chore: rebuild ipk and feed index"
          git push
